# Runs scripts/self-test.sh: hook syntax, 150+ adversarial guard tests, plugin hook tests,
# config validation, Action pinning, internal links, version consistency and agent-doctor.
#
# macOS runs every bash hook with /bin/bash (bash 3.2), the version that ships with macOS,
# because a hook that errors there fails open.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      HOOK_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || 'bash' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          python3 --version
          "$HOOK_BASH" --version | head -1
          jq --version
          git --version
      - name: Run self-test
        run: '"$HOOK_BASH" scripts/self-test.sh'
