# Runs scripts/self-test.sh: hook syntax, 150+ adversarial guard tests, plugin hook tests,
# config validation, Action pinning, internal links, version consistency and agent-doctor.
#
# macOS runs every bash hook with /bin/bash (bash 3.2), the version that ships with macOS,
# because a hook that errors there fails open.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            hook_bash: bash
          - os: macos-latest
            hook_bash: /bin/bash      # bash 3.2, as shipped with macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Job-level env can use matrix but not runner (an invalid context here fails the
      # whole workflow before any job starts).
      HOOK_BASH: ${{ matrix.hook_bash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          python3 --version
          "$HOOK_BASH" --version | head -1
          jq --version
          git --version
      - name: Run self-test
        run: '"$HOOK_BASH" scripts/self-test.sh'
