# Copy to .github/workflows/agent-guardrails.yml
#
# Server-side checks that hold even if an agent (or a human) skips local hooks.
# Make these required status checks in your branch protection rules.
#
# Security tips:
# - Pin third-party actions to a full commit SHA, not a tag (tags can be moved).
# - Keep `permissions` minimal. This workflow only needs to read code.
name: agent-guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6          # Pin to a SHA in production
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Verify the checksum from the release page before trusting the binary:
          # echo "<sha256>  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git --redact --verbose .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write                 # Lets the action comment a summary
    steps:
      - uses: actions/dependency-review-action@v5   # Pin to a SHA in production
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  governance-files:
    # Flags PRs that change the rules agents follow, so a human looks closely.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for governance changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- AGENTS.md CLAUDE.md '.agent/**' '.claude/**' '.cursor/**' .github/copilot-instructions.md .pre-commit-config.yaml)"
          if [ -n "$changed" ]; then
            echo "::warning::This PR changes agent governance files. Require a human security review."
            echo "$changed"
          fi
